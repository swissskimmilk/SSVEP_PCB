; SSVEP board firmware: Seeed XIAO nRF52840 (Adafruit-based "non-mbed" core)
; driving the ADS131M08 front end and streaming over BLE (USB CDC on the bench).

[platformio]
default_envs = xiao

[env:xiao]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -DFW_VERSION=1
; Upload uses the stock UF2/DFU bootloader over USB. Never upload with electrodes on a person.
